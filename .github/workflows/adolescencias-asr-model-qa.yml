name: QA offline Whisper model transport Adolescencias M1
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/adolescencias-asr-model-qa.yml'
permissions:
  contents: read
jobs:
  prepare-offline-asr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Python 3.13 para compatibilidade do ambiente local
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Obter dependencias binarias CPU sem executa-las
        run: |
          mkdir -p dist/wheelhouse
          python -m pip download --disable-pip-version-check --only-binary=:all: --dest dist/wheelhouse "faster-whisper==1.2.1"
          test $(find dist/wheelhouse -name '*.whl' | wc -l) -gt 4
      - name: Obter pesos originais Whisper-small de fonte publica
        run: |
          python -m pip install --disable-pip-version-check "huggingface_hub>=0.24,<1"
          python - <<'PY'
          from huggingface_hub import snapshot_download
          from pathlib import Path
          import json
          d=Path("dist/model")
          d.mkdir(exist_ok=True,parents=True)
          snapshot_download(repo_id="Systran/faster-whisper-small",revision="main",local_dir=str(d),allow_patterns=["model.bin","config.json","tokenizer.json","vocabulary.json","preprocessor_config.json"],max_workers=4)
          assert (d/"model.bin").is_file() and (d/"model.bin").stat().st_size>100000000
          print("model file size", (d/"model.bin").stat().st_size)
          (d/"ORIGEM.txt").write_text("Systran/faster-whisper-small; Whisper MIT; candidato QA offline; nao publicar video\\n",encoding="utf-8")
          PY
      - name: Empacotar modelo e rodas separadamente, verificador sha
        run: |
          cd dist
          sha256sum model/* wheelhouse/*.whl > MANIFESTO_SHA256.txt
          tar -czf ../ASR_SMALL_MODEL_TAR_GZ.tar.gz model MANIFESTO_SHA256.txt
          tar -czf ../ASR_WHEELHOUSE_TAR_GZ.tar.gz wheelhouse
          ls -lh ../*.tar.gz
      - name: Salvar modelo para QA local
        uses: actions/upload-artifact@v4
        with:
          name: ASR_WHISPER_SMALL_MODELO_OFFLINE_QA
          path: ASR_SMALL_MODEL_TAR_GZ.tar.gz
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
      - name: Salvar dependencias para QA local
        uses: actions/upload-artifact@v4
        with:
          name: ASR_WHISPER_SMALL_WHEELHOUSE_OFFLINE_QA
          path: ASR_WHEELHOUSE_TAR_GZ.tar.gz
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
